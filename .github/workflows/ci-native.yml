name: ci-native

# The native (Rust + C++) gate. Path-filtered at the WORKFLOW level, so filtering costs
# zero jobs — the old `changes` (dorny/paths-filter) and `ci-ok` (fail-closed aggregator)
# jobs are gone. See docs/superpowers/specs/2026-07-22-ci-consolidation-design.md.
#
# NOTE: gamedata/** IS here, and must be. All three gamedata gates — test-gamedata.sh (the loader
# unit test), check-gamedata-owners.sh (the ownership boundary) and check-gamedata-sigs.sh (no
# build-specific operand in a signature) — run from scripts/ci-native.sh; ci-js.sh has no gamedata
# gate at all. Nothing compiles the tree in, but a gamedata-only change is the single most common
# PR on the CS2 update treadmill, and it is exactly the change those gates exist to catch: the
# stale `SetModel` operand that turned EntityRef.setModel into a silent no-op was gamedata-only.
# Each gate script's own path is listed too, so editing a gate runs it.
on:
  pull_request:
    paths:
      - 'core/**'
      - 'shim/**'
      - 'games/**'
      - 'gamedata/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'third_party/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'packages/*/LICENSE-*'
      - 'scripts/ci-native.sh'
      - 'scripts/gen-licenses.sh'
      - 'scripts/check-licenses-generated.sh'
      - 'scripts/check-core-boundary.sh'
      - 'scripts/check-core-names.sh'
      - 'scripts/test-boundary-nameleak.sh'
      - 'scripts/test-sigscan.sh'
      - 'scripts/test-gamedata.sh'
      - 'scripts/check-gamedata-owners.sh'
      - 'scripts/check-gamedata-sigs.sh'
      - 'scripts/lib/**'
      - 'patches/metamod-source/**'
      - 'tools/khook-probe/**'
      - 'tools/engine-function-probe/**'
      - 'scripts/*engine-function*'
      - 'scripts/*khook*'
      - 'scripts/*metamod*'
      - 'scripts/cloud/*metamod*'
      - '.github/workflows/ci-native.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'shim/**'
      - 'games/**'
      - 'gamedata/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'third_party/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'packages/*/LICENSE-*'
      - 'scripts/ci-native.sh'
      - 'scripts/gen-licenses.sh'
      - 'scripts/check-licenses-generated.sh'
      - 'scripts/check-core-boundary.sh'
      - 'scripts/check-core-names.sh'
      - 'scripts/test-boundary-nameleak.sh'
      - 'scripts/test-sigscan.sh'
      - 'scripts/test-gamedata.sh'
      - 'scripts/check-gamedata-owners.sh'
      - 'scripts/check-gamedata-sigs.sh'
      - 'scripts/lib/**'
      - 'patches/metamod-source/**'
      - 'tools/khook-probe/**'
      - 'tools/engine-function-probe/**'
      - 'scripts/*engine-function*'
      - 'scripts/*khook*'
      - 'scripts/*metamod*'
      - 'scripts/cloud/*metamod*'
      - '.github/workflows/ci-native.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only contents:read. The old pull-requests:read existed solely for dorny/paths-filter's
# "list PR files" API call, and paths-filter is gone.
permissions:
  contents: read

jobs:
  # One job per scripts/ci-native.sh shard, in parallel. The shards share no build outputs, so each
  # starts from its own clean checkout exactly as a serial run would reach it. This list must equal
  # `scripts/ci-native.sh --list`; the rust shard fails if the two drift.
  native:
    name: native (${{ matrix.shard }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      # Report every shard's verdict on a failing PR instead of the first one to finish.
      fail-fast: false
      matrix:
        shard: [rust, fixtures, engine-function, runtime]
    steps:
      - uses: useblacksmith/checkout@v1
        with: { submodules: recursive }   # gen-licenses.sh reads the vendored third_party/ submodules
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # The fixtures shard runs no cargo, so it neither needs nor should mint a target/ cache.
        if: matrix.shard != 'fixtures'
        with:
          # rust and engine-function build the same debug/test profile, so they share the original
          # entry, and only the rust shard (the superset) saves it. The runtime shard's Docker
          # build fills target/release with Bullseye-compiled deps instead, so it keeps its own
          # entry under the shared key `sniper`, which release.yml restores for the tag build.
          shared-key: ${{ matrix.shard == 'runtime' && 'sniper' || '' }}
          # Restore-only on PRs. Returns the ~11s save step, and stops every branch minting
          # its own ~383MB entry — the predecessor repo reached 77 entries / 4.34GB against a
          # 10GB quota, and LRU eviction of a rust-cache entry is exactly what turns a 13s
          # cargo build into a 3-4 minute one. Only main populates the cache.
          # Accepted cost: a PR that changes Cargo.lock misses and rebuilds fully on every
          # push until it merges (9 such PRs in the last 60 days).
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard != 'engine-function' }}
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.shard }}
      # libffi configure.ac uses LT_SYS_SYMBOL_USCORE from libltdl-dev's
      # ltdl.m4. This is a bootstrap dependency, not a linked runtime library.
      - name: install pinned libffi bootstrap and native diagnostic dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake libtool libltdl-dev gdb
      - name: native gate suite (${{ matrix.shard }} shard)
        run: |
          # Only a disposable CI runner may change the kernel core policy: a GitHub-hosted
          # runner, or a Blacksmith runner (an ephemeral VM that reports itself as self-hosted).
          [[ "$GITHUB_ACTIONS" == true && ( "$RUNNER_ENVIRONMENT" == github-hosted || "$RUNNER_NAME" == blacksmith-* ) ]] || {
            echo 'FAIL core capture requires a disposable CI runner' >&2; exit 2;
          }
          diagnostic_dir="$PWD/build/engine-function-v8-diagnostics"
          mkdir -p "$diagnostic_dir/cores" "$diagnostic_dir/artifact"
          original_core_pattern="$(cat /proc/sys/kernel/core_pattern)"
          restore_core_pattern() {
            gate_status=$?
            trap - EXIT
            if ! sudo sysctl -w "kernel.core_pattern=$original_core_pattern"; then
              echo 'FAIL restoring runner core_pattern' >&2
              [[ $gate_status != 0 ]] || gate_status=2
            fi
            exit "$gate_status"
          }
          trap restore_core_pattern EXIT
          sudo sysctl -w "kernel.core_pattern=$diagnostic_dir/cores/core.%p.%t"
          S2FN_V8_DIAGNOSTICS=1 S2FN_V8_DIAGNOSTIC_RUNS=32 bash scripts/ci-native.sh "${{ matrix.shard }}"
      - name: retain compact V8 diagnostics and matching binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-function-v8-diagnostics-${{ matrix.shard }}
          # Raw multi-GiB cores are runner-local and must never be uploaded.
          path: |
            build/engine-function-v8-diagnostics/artifact/
            !build/engine-function-v8-diagnostics/cores/**
          if-no-files-found: ignore
          retention-days: 3
