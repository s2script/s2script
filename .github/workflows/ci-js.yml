name: ci-js

# The JS/TS gate. Path-filtered at the WORKFLOW level — see ci-native.yml.
#
# docker/** is here because test-gate.sh asserts on docker/pre.sh, docker/docker-compose.yml
# and docker/docker-compose.gate.yml. scripts/** is deliberately broad and overlaps
# ci-native.yml's filter; overlap just means both run, which is correct.
#
# core/** is here for a NON-OBVIOUS reason: check-core-js-lint.sh runs in THIS suite, and it derives
# the prelude's legal globals by scanning core/src/*.rs for `set_native` registrations. So a Rust-only
# change that renames or MOVES a native breaks the prelude's `no-undef` gate — and before this filter
# existed, a core-only PR ran ci-native (which does not lint JS) and nothing else, so CI went green on
# a broken gate. The core-stabilization work that moves natives into per-feature modules is exactly
# that shape. ci-native.yml already lists core/**; both suites need it, for different reasons.
on:
  pull_request:
    paths:
      - 'core/**'
      - 'plugins/**'
      - 'packages/**'
      - 'examples/**'
      - 'tools/**'
      - 'games/**'
      - 'gamedata/**'
      - 'scripts/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.gitignore'
      - '.github/workflows/ci-js.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'plugins/**'
      - 'packages/**'
      - 'examples/**'
      - 'tools/**'
      - 'games/**'
      - 'gamedata/**'
      - 'scripts/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.gitignore'
      - '.github/workflows/ci-js.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      # No submodules: nothing in the JS gate reads third_party/, so the checkout stays cheap.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match changesets.yml so the two can never disagree about `npm ci`.
          node-version: "22"
          cache: npm
      - name: JS gate suite
        run: bash scripts/ci-js.sh
